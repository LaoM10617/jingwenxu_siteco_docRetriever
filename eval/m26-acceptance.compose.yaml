# Test-only override; not the normal application entry point.
services:
  backend:
    command: [python, -m, uvicorn, 'm26_acceptance_app:create_app', --factory, --app-dir, /app/eval, --host, 0.0.0.0, --port, '8000', --workers, '1']
    environment:
      M26_FORBID_PROVIDER: ${M26_FORBID_PROVIDER:-0}
    volumes:
      - type: bind
        source: ./eval/m26_acceptance_app.py
        target: /app/eval/m26_acceptance_app.py
        read_only: true
