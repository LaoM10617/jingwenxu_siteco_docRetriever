# Checks that need no secrets: this repository is public, so real model/embedding
# calls and paid probes stay local (see scripts/siteco.py check for the local mirror).
name: CI

on:
  push:
    branches: [main]
    paths-ignore: ['**.md']
  pull_request:
    paths-ignore: ['**.md']
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Actions are pinned to commit SHAs (tag in the comment), like the image digests in the Dockerfiles.
jobs:
  backend:
    name: Backend tests (incl. Docker isolation)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      # Same uv version as [tool.uv] required-version and the Dockerfile (ADR 0007).
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: '0.12.24'
          enable-cache: true
      - name: Lock files match pyproject.toml; runner export matches its lock
        run: |
          uv lock --check
          uv lock --check --directory runner
          uv export --directory runner --frozen --no-dev --no-emit-project --no-header --format requirements-txt --quiet | diff - runner/requirements.lock
      - name: Install locked dependencies
        run: uv sync --locked
      - name: Build CSV runner image
        # --provenance=false keeps the image ID stable; the Docker tests run against this exact ID.
        run: echo "SITECO_RUNNER_IMAGE=$(docker build -q --provenance=false -t siteco-csv-runner:ci -f runner/Dockerfile .)" >> "$GITHUB_ENV"
      - name: Run pytest
        env:
          SITECO_DOCKER_TESTS: '1'
        run: uv run --locked --no-sync python -m pytest -q -p no:cacheprovider

  frontend:
    name: Frontend type check and build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund --prefix frontend
      - run: npm run build --prefix frontend

  images:
    name: Compose configuration and images
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: docker compose config --quiet
      - run: docker compose build

  launcher-windows:
    name: Launcher tests and worker dependencies (Windows)
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: '0.12.24'
          enable-cache: true
      # The host worker runs from this lock on Windows, so installing it is itself a check.
      - name: Install locked dependencies
        run: uv sync --locked
      - name: Run launcher tests
        run: uv run --locked --no-sync python -m pytest -q -p no:cacheprovider tests/test_launcher.py
